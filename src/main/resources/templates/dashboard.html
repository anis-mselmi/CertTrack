<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CertTrack Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="/js/dashboard.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f6f8fb; color: #172033; }
        header { background: #172033; color: #fff; padding: 1rem 2rem; }
        main { padding: 2rem; display: grid; gap: 1.5rem; }
        section { background: #fff; border-radius: 12px; padding: 1.25rem; box-shadow: 0 8px 24px rgba(18, 38, 63, .08); }
        form { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; }
        label { display: grid; gap: .25rem; font-size: .9rem; }
        input, button { border: 1px solid #ccd5e1; border-radius: 8px; padding: .65rem .75rem; }
        button { background: #2563eb; color: #fff; border: 0; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #e5e7eb; padding: .75rem; text-align: left; }
        .badge { border-radius: 999px; padding: .25rem .6rem; color: #fff; font-size: .8rem; }
        .ACTIVE { background: #16a34a; }
        .EXPIRING_SOON { background: #d97706; }
        .EXPIRED { background: #dc2626; }
        .muted { color: #64748b; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<header>
    <h1>CertTrack</h1>
    <p class="muted">Certification expiry and skill coverage dashboard</p>
</header>
<main>
    <section>
        <h2>Login</h2>
        <form id="login-form">
            <label>Username <input id="username" value="admin" autocomplete="username" required></label>
            <label>Password <input id="password" type="password" value="password" autocomplete="current-password" required></label>
            <button type="submit">Get Token</button>
            <span id="login-status" class="muted"></span>
        </form>
    </section>
    <div class="grid">
        <section>
            <h2>Certifications</h2>
            <table>
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Issuer</th>
                    <th>Expiry</th>
                    <th>Status</th>
                    <th>Skills</th>
                </tr>
                </thead>
                <tbody id="certification-table"></tbody>
            </table>
        </section>
        <section>
            <h2>Skill Tags</h2>
            <canvas id="skill-chart"></canvas>
        </section>
    </div>
</main>
</body>
</html>
