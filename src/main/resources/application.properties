spring.application.name=certtrack
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

app.security.username=${CERTTRACK_USERNAME:admin}
app.security.password=${CERTTRACK_PASSWORD:password}
app.security.jwt-secret=${CERTTRACK_JWT_SECRET:certtrack-dev-secret-certtrack-dev-secret-32}
app.security.jwt-expiration-minutes=${CERTTRACK_JWT_EXPIRATION_MINUTES:120}

springdoc.swagger-ui.path=/swagger-ui.html

#---
spring.config.activate.on-profile=dev
spring.datasource.url=jdbc:h2:mem:certtrack;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

#---
spring.config.activate.on-profile=prod
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/certtrack}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.security.username=${CERTTRACK_USERNAME}
app.security.password=${CERTTRACK_PASSWORD}
app.security.jwt-secret=${CERTTRACK_JWT_SECRET}
